<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Gallery with Modal</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1 class="title">Image Gallery</h1>

    <!-- Gallery -->
    <div class="gallery">
      <img src="https://picsum.photos/id/1015/400/300" alt="Image 1" />
      <img src="https://picsum.photos/id/1016/400/300" alt="Image 2" />
      <img src="https://picsum.photos/id/1025/400/300" alt="Image 3" />
      <img src="https://picsum.photos/id/1035/400/300" alt="Image 4" />
      <img src="https://picsum.photos/id/1045/400/300" alt="Image 5" />
      <img src="https://picsum.photos/id/1055/400/300" alt="Image 6" />
    </div>

    <!-- Modal -->
    <div class="modal" id="modal">
      <span class="close">&times;</span>
      <img class="modal-img" id="modalImg" />
    </div>

    <script src="script.js"></script>
  </body>
</html>
